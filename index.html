<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Agricultural Stick V2 - Field Dashboard</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #f0f4f1;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: linear-gradient(135deg, #1b5e20, #2e7d32);
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      z-index: 1000;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-title h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }
    .btn-refresh {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: 'Kanit', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-refresh:hover {
      background-color: #388e3c;
      transform: translateY(-1px);
    }

    /* Summary Bar */
    .summary-bar {
      background: white;
      padding: 10px 20px;
      display: flex;
      gap: 20px;
      overflow-x: auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      z-index: 999;
    }
    .stat-card {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 170px;
      padding: 6px 12px;
      background: #f8faf8;
      border-radius: 8px;
      border-left: 4px solid #2e7d32;
    }
    .stat-card i {
      font-size: 1.4rem;
      color: #2e7d32;
    }
    .stat-card .val {
      font-size: 1rem;
      font-weight: 600;
      color: #1b5e20;
    }
    .stat-card .lbl {
      font-size: 0.75rem;
      color: #666;
    }

    /* Map Container */
    #map {
      flex: 1;
      width: 100%;
      z-index: 1;
    }

    /* Custom Leaflet Popup */
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      padding: 5px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .popup-box {
      font-family: 'Kanit', sans-serif;
      font-size: 0.88rem;
      min-width: 200px;
    }
    .popup-header {
      background: #e8f5e9;
      color: #1b5e20;
      padding: 8px 10px;
      border-radius: 8px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .popup-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px dashed #eee;
    }
    .popup-row:last-child {
      border-bottom: none;
    }
    .popup-label {
      color: #555;
    }
    .popup-val {
      font-weight: 500;
      color: #111;
    }
  </style>
</head>
<!-- ตั้งค่า PWA สำหรับ Android และ iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b5e20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SmartStickV2">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- สคริปต์ลงทะเบียน Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('PWA Service Worker Ready!'))
          .catch(err => console.error('Service Worker Error:', err));
      });
    }
  </script>
<body>

  <header>
    <div class="header-title">
      <i class="fa-solid fa-seedling fa-lg"></i>
      <h1>ไม้เท้าเก็บข้อมูลการเกษตรอัจฉริยะ V2 (ESP32 + GPS)</h1>
    </div>
    <button class="btn-refresh" onclick="loadFirebaseData()">
      <i class="fa-solid fa-arrows-rotate"></i> อัปเดตข้อมูล
    </button>
  </header>

  <!-- สรุปข้อมูลภาพรวม -->
  <div class="summary-bar">
    <div class="stat-card">
      <i class="fa-solid fa-map-pin"></i>
      <div>
        <div class="val" id="stat-count">0 จุด</div>
        <div class="lbl">พิกัดบันทึกทั้งหมด</div>
      </div>
    </div>
    <div class="stat-card" style="border-left-color: #0288d1;">
      <i class="fa-solid fa-clock" style="color: #0288d1;"></i>
      <div>
        <div class="val" id="stat-time">-</div>
        <div class="lbl">เวลาบันทึกล่าสุด (GPS)</div>
      </div>
    </div>
    <div class="stat-card" style="border-left-color: #ed6c02;">
      <i class="fa-solid fa-location-crosshairs" style="color: #ed6c02;"></i>
      <div>
        <div class="val" id="stat-last-pos">-</div>
        <div class="lbl">พิกัดล่าสุด (Lat, Lng)</div>
      </div>
    </div>
  </div>

  <!-- พื้นที่แสดงแผนที่ -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // -------------------------------------------------------------
    // 1. ตั้งค่า Firebase Realtime Database URL
    // (กรุณาเปลี่ยน URL ด้านล่างให้เป็น URL ของโปรเจกต์คุณ)
    // -------------------------------------------------------------
    const FIREBASE_URL = "https://esp32test-337c8-default-rtdb.asia-southeast1.firebasedatabase.app/measurements.json";

    // พิกัดเริ่มต้น ( default: กาญจนบุรี )
    const defaultLat = 14.0205;
    const defaultLng = 99.5321;

    // เริ่มต้นแผนที่ Leaflet
    const map = L.map('map').setView([defaultLat, defaultLng], 12);
    let markersGroup = L.featureGroup().addTo(map);

    // โหลดแผนที่ OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors | Smart Agriculture Stick V2'
    }).addTo(map);

    // สร้าง custom icon สำหรับปักหมุดจุดวัด
    const greenIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    // -------------------------------------------------------------
    // 2. ฟังก์ชันดึงข้อมูลจาก Firebase มาแสดงบนแผนที่
    // -------------------------------------------------------------
    async function loadFirebaseData() {
      const btn = document.querySelector('.btn-refresh');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลด...';

      try {
        const response = await fetch(FIREBASE_URL);
        const data = await response.json();

        // ล้างหมุดเดิมออกก่อน
        markersGroup.clearLayers();

        if (!data) {
          document.getElementById('stat-count').innerText = "0 จุด";
          document.getElementById('stat-time').innerText = "ไม่มีข้อมูล";
          document.getElementById('stat-last-pos').innerText = "-";
          alert("ยังไม่มีข้อมูลบันทึกใน Firebase");
          btn.innerHTML = '<i class="fa-solid fa-arrows-rotate"></i> อัปเดตข้อมูล';
          return;
        }

        const keys = Object.keys(data);
        let pointCount = 0;
        let lastTimestamp = "";
        let lastLat = 0, lastLng = 0;

        keys.forEach(key => {
          const item = data[key];

          // ตรวจสอบว่ามีพิกัด GPS หรือไม่
          if (item && item.latitude && item.longitude) {
            pointCount++;
            lastLat = item.latitude;
            lastLng = item.longitude;
            lastTimestamp = item.timestamp || key;

            // รูปแบบ HTML ใน Popup หมุด (แสดงเฉพาะ วันที่-เวลา, พิกัด GPS 6 ตำแหน่ง, และ อุณหภูมิ)
            const popupHTML = `
              <div class="popup-box">
                <div class="popup-header">
                  <i class="fa-solid fa-location-dot"></i>
                  <span>จุดวัดที่ ${pointCount}</span>
                </div>
                <div class="popup-row">
                  <span class="popup-label"><i class="fa-solid fa-clock"></i> วันที่-เวลา:</span>
                  <span class="popup-val">${item.timestamp || key}</span>
                </div>
                <div class="popup-row">
                  <span class="popup-label"><i class="fa-solid fa-compass"></i> พิกัด GPS:</span>
                  <span class="popup-val">${item.latitude.toFixed(6)}, ${item.longitude.toFixed(6)}</span>
                </div>
                <div class="popup-row">
                  <span class="popup-label"><i class="fa-solid fa-temperature-half" style="color:#e65100;"></i> อุณหภูมิ:</span>
                  <span class="popup-val">${item.temperature ?? '-'} °C</span>
                </div>
              </div>
            `;

            // เพิ่มหมุดลงกลุ่ม Layer
            const marker = L.marker([item.latitude, item.longitude], { icon: greenIcon })
              .bindPopup(popupHTML);
            markersGroup.addLayer(marker);
          }
        });

        // อัปเดตการ์ดสรุปผล
        document.getElementById('stat-count').innerText = `${pointCount} จุด`;
        document.getElementById('stat-time').innerText = lastTimestamp || "-";
        document.getElementById('stat-last-pos').innerText = pointCount > 0 ? `${lastLat.toFixed(4)}, ${lastLng.toFixed(4)}` : "-";

        // ปรับซูมแผนที่ให้อยู่ในขอบเขตของพิกัดทั้งหมดอัตโนมัติ
        if (pointCount > 0) {
          map.fitBounds(markersGroup.getBounds(), { padding: [50, 50] });
        }

      } catch (error) {
        console.error("Error loading data from Firebase:", error);
        alert("เกิดข้อผิดพลาดในการโหลดข้อมูล โปรดตรวจสอบ URL ของ Firebase");
      } finally {
        btn.innerHTML = '<i class="fa-solid fa-arrows-rotate"></i> อัปเดตข้อมูล';
      }
    }

    // เรียกโหลดข้อมูลเมื่อเปิดหน้าเว็บ
    loadFirebaseData();
  </script>
</body>
</html>
